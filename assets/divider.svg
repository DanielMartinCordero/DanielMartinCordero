<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g">
      <stop offset="0" stop-color="#9ecbff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="3" width="1200" height="2" fill="url(#l)"/>
  <circle cy="4" r="4" fill="url(#g)">
    <animate attributeName="cx" values="0;1200" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
