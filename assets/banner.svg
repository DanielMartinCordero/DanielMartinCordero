    .s3 { animation-delay: 6s; }
    .meta { font: 400 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
    .cursor { fill: #58a6ff; animation: blink 1s steps(2, start) infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.35); } }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      6% { opacity: 1; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(0); }
      36% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    @keyframes blink { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .node, .sub, .cursor { animation: none; }
      .sub { opacity: 0; }
      .s1 { opacity: 1; }
    }
  </style>
