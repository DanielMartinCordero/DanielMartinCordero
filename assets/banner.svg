  <style>
    .edge { stroke: #2f81f7; stroke-opacity: .22; stroke-width: 1; }
    .flow { stroke-opacity: .5; stroke-dasharray: 3 9; animation: dash 1.8s linear infinite; }
    .node { fill: #58a6ff; transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    .name { font: 700 54px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }
    .sub { font: 500 24px 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace; fill: #58a6ff; opacity: 0; animation: cycle 9s ease-in-out infinite; }
