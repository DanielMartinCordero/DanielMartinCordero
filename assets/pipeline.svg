<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="190" viewBox="0 0 1040 190" role="img" aria-labelledby="t d">
  <title id="t">AI video pipeline</title>
  <desc id="d">Gemini writes the script, then for each scene edge-tts narrates and ComfyUI with Flux draws the image; MoviePy assembles the final 9:16 MP4.</desc>
  <style>
    .bt { font: 700 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }
    .bs { font: 400 12px 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace; fill: #8b949e; }
    .lb { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
    .loop { animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -22; } }
    @media (prefers-reduced-motion: reduce) { .loop { animation: none; } }
  </style>
  <rect width="1040" height="190" rx="14" fill="#0b1020"/>
  <rect x="20" y="40" width="160" height="72" rx="10" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/><text class="bt" x="100.0" y="71" text-anchor="middle">Gemini 2.5 Flash</text><text class="bs" x="100.0" y="92" text-anchor="middle">script (JSON scenes)</text><rect x="230" y="40" width="160" height="72" rx="10" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/><text class="bt" x="310.0" y="71" text-anchor="middle">edge-tts</text><text class="bs" x="310.0" y="92" text-anchor="middle">narration (.mp3)</text><rect x="440" y="40" width="160" height="72" rx="10" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/><text class="bt" x="520.0" y="71" text-anchor="middle">ComfyUI + Flux</text><text class="bs" x="520.0" y="92" text-anchor="middle">scene image (.png)</text><rect x="650" y="40" width="160" height="72" rx="10" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/><text class="bt" x="730.0" y="71" text-anchor="middle">MoviePy</text><text class="bs" x="730.0" y="92" text-anchor="middle">zoom-in + assembly</text><rect x="860" y="40" width="160" height="72" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/><text class="bt" x="940.0" y="71" text-anchor="middle">MP4 · 9:16</text><text class="bs" x="940.0" y="92" text-anchor="middle">final video (.mp4)</text>
  <line x1="184" y1="76.0" x2="220" y2="76.0" stroke="#30363d" stroke-width="2"/><path d="M220 71.0 L228 76.0 L220 81.0 Z" fill="#30363d"/><circle r="3.2" fill="#58a6ff"><animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite" path="M184 76.0 L220 76.0"/></circle><line x1="394" y1="76.0" x2="430" y2="76.0" stroke="#30363d" stroke-width="2"/><path d="M430 71.0 L438 76.0 L430 81.0 Z" fill="#30363d"/><circle r="3.2" fill="#58a6ff"><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M394 76.0 L430 76.0"/></circle><line x1="604" y1="76.0" x2="640" y2="76.0" stroke="#30363d" stroke-width="2"/><path d="M640 71.0 L648 76.0 L640 81.0 Z" fill="#30363d"/><circle r="3.2" fill="#58a6ff"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M604 76.0 L640 76.0"/></circle><line x1="814" y1="76.0" x2="850" y2="76.0" stroke="#30363d" stroke-width="2"/><path d="M850 71.0 L858 76.0 L850 81.0 Z" fill="#30363d"/><circle r="3.2" fill="#58a6ff"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M814 76.0 L850 76.0"/></circle>
  <rect x="218" y="26" width="394" height="100" rx="16" fill="none" stroke="#58a6ff" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="5 6" class="loop"/><text class="lb" x="415.0" y="150" text-anchor="middle">repeated for every scene (8-15 per video)</text>
</svg>
