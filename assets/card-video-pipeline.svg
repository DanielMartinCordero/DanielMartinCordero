<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-labelledby="t">
  <title id="t">AI Video Pipeline: Python · LLM + TTS + diffusion</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0c1a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".35"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 26px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }
    .sub { font: 500 14px 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace; fill: #58a6ff; }
    .body { font: 400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
    .chip { font: 500 12px 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace; fill: #9ecbff; }
    .status { font: 700 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #3fb950; letter-spacing: .08em; }
    .dot { animation: blink 1.6s ease-in-out infinite; }
    .icon { animation: float 4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    @keyframes float { 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .dot, .icon { animation: none; } }
  </style>
  <rect width="600" height="270" rx="16" fill="url(#bg)"/>
  <rect width="600" height="270" rx="16" fill="url(#glow)"/>
  <rect x=".75" y=".75" width="598.5" height="268.5" rx="15.5" fill="none" stroke="#1f6feb" stroke-opacity=".45" stroke-width="1.5"/>
  <rect y="0" width="160" height="2" fill="url(#edge)">
    <animate attributeName="x" values="-160;600" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g class="icon"><g transform="translate(508 26)"><rect x="0" y="0" width="56" height="64" rx="10" fill="#11203f" stroke="#58a6ff" stroke-width="2"/><path d="M22 20 L40 32 L22 44 Z" fill="#58a6ff"/><text x="28" y="58" text-anchor="middle" font-family="monospace" font-size="9" fill="#9ecbff">9:16</text></g></g>
  <text class="title" x="32" y="60">AI Video Pipeline</text>
  <text class="sub" x="32" y="86">Python · LLM + TTS + diffusion</text>
  <text class="body" x="32" y="126">Turns a topic into a vertical short video: Gemini</text><text class="body" x="32" y="150">writes the script, a neural voice narrates it, Flux</text><text class="body" x="32" y="174">draws every scene and MoviePy edits the final MP4.</text>
  <rect x="32" y="206" width="66" height="26" rx="13" fill="#11203f" stroke="#1f6feb" stroke-opacity=".6"/><text class="chip" x="65.0" y="223.5" text-anchor="middle">Python</text><rect x="106" y="206" width="96" height="26" rx="13" fill="#11203f" stroke="#1f6feb" stroke-opacity=".6"/><text class="chip" x="154.0" y="223.5" text-anchor="middle">Gemini API</text><rect x="210" y="206" width="126" height="26" rx="13" fill="#11203f" stroke="#1f6feb" stroke-opacity=".6"/><text class="chip" x="273.0" y="223.5" text-anchor="middle">ComfyUI + Flux</text><rect x="344" y="206" width="74" height="26" rx="13" fill="#11203f" stroke="#1f6feb" stroke-opacity=".6"/><text class="chip" x="381.0" y="223.5" text-anchor="middle">MoviePy</text>
  <rect x="470" y="226" width="106" height="22" rx="11" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".55"/>
  <circle class="dot" cx="483" cy="237" r="3.5" fill="#3fb950"/>
  <text class="status" x="494" y="241">COMPLETED</text>
</svg>
